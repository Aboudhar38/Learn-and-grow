<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Learn new skills with hands-on training and real-world projects.">

    <title>Learn & Grow</title>
<link rel="icon" type="image/icon" href="./assets/favicon.svg">
    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation bar -->
    <header class="header">
        <a href="#home" class="logo">
            Learn <span>&amp; Grow</span>
        </a>
        
        <nav class="navbar" aria-label="Main navigation">
            <a href="#home" class="active">Home</a>
            <a href="#courses">Courses</a>
            <a href="#resources">Resources</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Hero section -->
    <main>
        <section class="hero" id="home">

            <!-- Left side content -->
            <div class="hero-content">

                <p class="welcome">WELCOME, TRAINEES!</p>

                <h1>
                    Build Your Skills<br>
                    for a <span>Better Future</span>
                </h1>

                <p class="description">
                    Learn, practice, and grow with hands-on training
                    and real-world projects. Your journey to success
                    starts here.
                </p>

                <a href="#courses" class="btn">
                    Start Learning <span aria-hidden="true">→</span>
                </a>

                <!-- Learning benefits -->
                <div class="features">

                    <div class="feature">
                        <div class="feature-icon" aria-hidden="true">
                              <img src="./assets/book.png" alt="" class="icon">
                        </div>
                        <p>Expert<br>Guidance</p>
                    </div>

                    <div class="feature">
                        <div class="feature-icon" aria-hidden="true">
                              <img src="./assets/computer.png" alt="" class="icon">
                        </div>
                        <p>Hands-on<br>Practice</p>
                    </div>

                    <div class="feature">
                        <div class="feature-icon" aria-hidden="true">
                              <img src="./assets/increase1.png" alt="" class="icon">
                        </div>
                        <p>Real-World<br>Projects</p>
                    </div>

                </div>
            </div>

            <!-- Right side illustration -->
            <div class="hero-illustration">
                <img src="./assets/student-learning.png" alt="student-learning">

            </div>
        </section>


    </main>


</body>
</html>
